<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Hosting - dongzhongcen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --hot: #f43f5e;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* 动态背景 */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.03) 0%, transparent 60%);
      animation: rotate 60s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 网格背景 */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* 头部区域 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #ec4899);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .brand-text h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .brand-text p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
    }

    /* 作者卡片 */
    .author-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .author-card:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .author-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), #ec4899);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .author-info {
      display: flex;
      flex-direction: column;
    }

    .author-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-primary);
    }

    .author-role {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .author-arrow {
      color: var(--accent);
      font-size: 14px;
      margin-left: 8px;
      transition: transform 0.3s;
    }

    .author-card:hover .author-arrow {
      transform: translateX(4px);
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), #ec4899);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .stat-card:hover::before {
      transform: scaleX(1);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* 控制栏 */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 400px;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 18px;
    }

    .control-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .view-toggle {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
    }

    .view-btn {
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 16px;
    }

    .view-btn.active {
      background: var(--accent);
      color: white;
    }

    /* 下拉菜单 */
    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      min-width: 180px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s ease;
      z-index: 100;
      box-shadow: var(--shadow-lg);
    }

    .dropdown.active .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      padding: 12px 16px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .dropdown-item:first-child {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }

    .dropdown-item:last-child {
      border-radius: 0 0 var(--radius-md) var(--radius-md);
    }

    /* 文件容器 */
    .files-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .files-header {
      display: grid;
      grid-template-columns: 1fr 120px 100px 140px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .files-header {
        display: none;
      }
    }

    /* 列表视图 */
    .file-list {
      display: flex;
      flex-direction: column;
    }

    .file-item {
      display: grid;
      grid-template-columns: 1fr 120px 100px 140px;
      padding: 16px 24px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-item:hover {
      background: var(--bg-hover);
    }

    @media (max-width: 768px) {
      .file-item {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 20px;
      }
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .file-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .file-item:hover .file-icon-wrapper {
      transform: scale(1.1) rotate(5deg);
    }

    .file-icon-wrapper.image { background: rgba(59, 130, 246, 0.15); }
    .file-icon-wrapper.video { background: rgba(236, 72, 153, 0.15); }
    .file-icon-wrapper.audio { background: rgba(168, 85, 247, 0.15); }
    .file-icon-wrapper.document { background: rgba(34, 197, 94, 0.15); }
    .file-icon-wrapper.archive { background: rgba(245, 158, 11, 0.15); }
    .file-icon-wrapper.code { background: rgba(99, 102, 241, 0.15); }
    .file-icon-wrapper.default { background: rgba(148, 163, 184, 0.1); }

    .file-details {
      min-width: 0;
    }

    .file-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .file-type-badge {
      padding: 2px 8px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 4px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
    }

    .file-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .file-size {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .download-count {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .download-count.hot {
      color: var(--hot);
    }

    .download-count.hot .count-icon {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .file-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .download-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
    }

    /* 网格视图 */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 24px;
    }

    .grid-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      transition: all 0.3s ease;
    }

    .grid-item:hover {
      background: var(--bg-hover);
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .grid-item .file-icon-wrapper {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }

    .grid-item .file-name {
      margin-bottom: 8px;
    }

    .grid-item .file-meta {
      margin-bottom: 16px;
    }

    .grid-item .download-count {
      margin-bottom: 16px;
    }

    .grid-item .file-actions {
      justify-content: flex-start;
    }

    .grid-item .download-btn {
      flex: 1;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
    }

    .toast {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
      max-width: 400px;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(100%);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.success {
      border-left: 3px solid var(--success);
    }

    .toast.error {
      border-left: 3px solid var(--error);
    }

    /* 模态框 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px;
      max-width: 500px;
      width: 90%;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal.active .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 20px;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border-color: var(--error);
    }

    /* 动画 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .file-item, .grid-item {
      animation: fadeIn 0.4s ease forwards;
    }

    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">📁</div>
        <div class="brand-text">
          <h1>File Hosting</h1>
          <p>快速、安全地分享和管理文件</p>
        </div>
      </div>
      
      <a href="https://github.com/dongzhongcen" target="_blank" class="author-card">
        <div class="author-avatar">D</div>
        <div class="author-info">
          <span class="author-name">dongzhongcen</span>
          <span class="author-role">Owner</span>
        </div>
        <span class="author-arrow">→</span>
      </a>
    </header>

    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="totalFiles">0</div>
        <div class="stat-label">文件总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⬇️</div>
        <div class="stat-value" id="totalDownloads">0</div>
        <div class="stat-label">总下载次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-value" id="hotFile">-</div>
        <div class="stat-label">热门文件</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📊</div>
        <div class="stat-value" id="todayDownloads">0</div>
        <div class="stat-label">今日下载</div>
      </div>
    </div>

    <!-- 控制栏 -->
    <div class="control-bar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索文件...">
      </div>

      <div class="control-group">
        <div class="dropdown" id="sortDropdown">
          <button class="btn" onclick="toggleSortDropdown()">
            <span>⇅</span>
            <span id="sortLabel">排序</span>
          </button>
          <div class="dropdown-menu">
            <div class="dropdown-item" onclick="sortFiles('name')">📋 按名称</div>
            <div class="dropdown-item" onclick="sortFiles('size')">📏 按大小</div>
            <div class="dropdown-item" onclick="sortFiles('downloads')">⬇️ 按下载量</div>
            <div class="dropdown-item" onclick="sortFiles('date')">📅 按日期</div>
          </div>
        </div>

        <div class="view-toggle">
          <button class="view-btn active" onclick="switchView('list')" title="列表视图">☰</button>
          <button class="view-btn" onclick="switchView('grid')" title="网格视图">⊞</button>
        </div>
      </div>
    </div>

    <!-- 文件列表 -->
    <div class="files-container">
      <div class="files-header">
        <span>文件名</span>
        <span>大小</span>
        <span>下载</span>
        <span>操作</span>
      </div>
      <div id="fileList"></div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 详情模态框 -->
  <div class="modal" id="fileModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">文件详情</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // ========== 配置区域 ==========
    const files = [
      { name: "Test_Photo.png", size: null, date: new Date().toISOString() },
    ]
    // ==============================

    let currentView = 'list'
    let currentSort = 'name'
    let filteredFiles = [...files]

    // 下载数据管理
    function getDownloadData() {
      return JSON.parse(localStorage.getItem('fileDownloadData') || '{}')
    }

    function saveDownloadData(data) {
      localStorage.setItem('fileDownloadData', JSON.stringify(data))
    }

    function getDownloadCount(filename) {
      const data = getDownloadData()
      return data[filename]?.count || 0
    }

    function incrementDownloadCount(filename) {
      const data = getDownloadData()
      const today = new Date().toDateString()
      
      if (!data[filename]) {
        data[filename] = { count: 0, history: {} }
      }
      
      data[filename].count++
      data[filename].history[today] = (data[filename].history[today] || 0) + 1
      
      saveDownloadData(data)
      return data[filename].count
    }

    function getTodayDownloads() {
      const data = getDownloadData()
      const today = new Date().toDateString()
      let total = 0
      
      Object.values(data).forEach(file => {
        total += file.history[today] || 0
      })
      
      return total
    }

    // 文件类型识别
    function getFileType(filename) {
      const ext = filename.split('.').pop().toLowerCase()
      const types = {
        image: { ext: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'], icon: '🖼️', name: '图片', color: '#3b82f6' },
        video: { ext: ['mp4', 'avi', 'mov', 'mkv', 'flv', 'wmv'], icon: '🎬', name: '视频', color: '#ec4899' },
        audio: { ext: ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a'], icon: '🎵', name: '音频', color: '#a855f7' },
        document: { ext: ['pdf', 'doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'txt'], icon: '📄', name: '文档', color: '#22c55e' },
        archive: { ext: ['zip', 'rar', '7z', 'tar', 'gz'], icon: '📦', name: '压缩包', color: '#f59e0b' },
        code: { ext: ['js', 'html', 'css', 'py', 'java', 'cpp', 'c', 'go', 'rs', 'json', 'xml'], icon: '💻', name: '代码', color: '#6366f1' }
      }
      
      for (const [type, info] of Object.entries(types)) {
        if (info.ext.includes(ext)) {
          return { type, ...info }
        }
      }
      return { type: 'default', icon: '📎', name: '文件', color: '#94a3b8' }
    }

    // 格式化大小
    function formatSize(bytes) {
      if (bytes === null) return '未知'
      if (bytes === 0) return '0 B'
      const units = ['B', 'KB', 'MB', 'GB', 'TB']
      const k = 1024
      const i = Math.floor(Math.log(bytes) / Math.log(k))
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + units[i]
    }

    // Toast 提示
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer')
      const toast = document.createElement('div')
      toast.className = `toast ${type}`
      
      const icons = {
        success: '✅',
        error: '❌',
        info: 'ℹ️'
      }
      
      toast.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`
      container.appendChild(toast)
      
      setTimeout(() => {
        toast.style.opacity = '0'
        toast.style.transform = 'translateX(100%)'
        setTimeout(() => toast.remove(), 300)
      }, 3000)
    }

    // 复制链接
    function copyLink(filename) {
      const url = `${window.location.origin}/files/${filename}`
      navigator.clipboard.writeText(url).then(() => {
        showToast('链接已复制到剪贴板！')
      }).catch(() => {
        showToast('复制失败', 'error')
      })
    }

    // 显示详情
    function showFileDetails(filename) {
      const file = files.find(f => f.name === filename)
      const fileType = getFileType(filename)
      const downloadCount = getDownloadCount(filename)
      
      const modal = document.getElementById('fileModal')
      const body = document.getElementById('modalBody')
      
      body.innerHTML = `
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="file-icon-wrapper ${fileType.type}" style="width: 80px; height: 80px; font-size: 40px; margin: 0 auto 16px;">
            ${fileType.icon}
          </div>
          <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">${filename}</h2>
          <p style="color: var(--text-secondary); font-size: 14px;">${fileType.name} · ${formatSize(file.size)}</p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px;">
          <div style="background: var(--bg-card); padding: 16px; border-radius: var(--radius-md); text-align: center;">
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">下载次数</div>
            <div style="font-size: 24px; font-weight: 700; color: ${fileType.color};">${downloadCount}</div>
          </div>
          <div style="background: var(--bg-card); padding: 16px; border-radius: var(--radius-md); text-align: center;">
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">上传日期</div>
            <div style="font-size: 16px; font-weight: 600;">${new Date(file.date).toLocaleDateString('zh-CN')}</div>
          </div>
        </div>
        <div style="display: flex; gap: 12px;">
          <a class="download-btn" href="files/${filename}" download="${filename}" onclick="handleDownload('${filename}', event); closeModal();" style="flex: 1; text-align: center;">
            ⬇️ 立即下载
          </a>
          <button class="btn" onclick="copyLink('${filename}')" style="padding: 10px 20px;">
            📋 复制链接
          </button>
        </div>
      `
      
      modal.classList.add('active')
    }

    function closeModal() {
      document.getElementById('fileModal').classList.remove('active')
    }

    // 切换视图
    function switchView(view) {
      currentView = view
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.classList.toggle('active', 
          (view === 'list' && btn.textContent === '☰') ||
          (view === 'grid' && btn.textContent === '⊞')
        )
      })
      renderFileList()
    }

    // 排序
    function toggleSortDropdown() {
      document.getElementById('sortDropdown').classList.toggle('active')
    }

    function sortFiles(sortBy) {
      currentSort = sortBy
      const labels = {
        name: '按名称',
        size: '按大小',
        downloads: '按下载量',
        date: '按日期'
      }
      document.getElementById('sortLabel').textContent = labels[sortBy]
      document.getElementById('sortDropdown').classList.remove('active')
      
      filteredFiles.sort((a, b) => {
        switch(sortBy) {
          case 'name': return a.name.localeCompare(b.name)
          case 'size': return (b.size || 0) - (a.size || 0)
          case 'downloads': return getDownloadCount(b.name) - getDownloadCount(a.name)
          case 'date': return new Date(b.date) - new Date(a.date)
          default: return 0
        }
      })
      
      renderFileList()
    }

    // 搜索
    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase()
      filteredFiles = files.filter(f => f.name.toLowerCase().includes(query))
      renderFileList()
    })

    // 执行下载
    function doDownload(filename) {
      const a = document.createElement('a')
      a.href = `files/${filename}`
      a.download = filename
      a.style.display = 'none'
      document.body.appendChild(a)
      a.click()
      document.body.removeChild(a)
    }

    // 更新下载计数 UI
    function updateDownloadUI(filename, newCount) {
      document.querySelectorAll('.file-item, .grid-item').forEach(item => {
        const nameEl = item.querySelector('.file-name')
        if (nameEl && nameEl.textContent.includes(filename)) {
          const countEl = item.querySelector('.count-value')
          const countContainer = item.querySelector('.download-count')
          if (countEl) {
            countEl.textContent = item.classList.contains('grid-item') ? newCount + ' 次下载' : newCount
          }
          if (countContainer && newCount >= 5) {
            countContainer.classList.add('hot')
          }
        }
      })
      updateStats()
    }

    // 处理下载
    function handleDownload(filename, event) {
      if (event) {
        event.stopPropagation()
        event.preventDefault()
      }
      
      doDownload(filename)
      
      const newCount = incrementDownloadCount(filename)
      updateDownloadUI(filename, newCount)
      
      showToast(`⬇️ 正在下载: ${filename}`)
    }

    // 更新统计
    function updateStats() {
      const totalFiles = files.length
      let totalDownloads = 0
      let maxDownloads = 0
      let hotFileName = '-'
      
      files.forEach(file => {
        const count = getDownloadCount(file.name)
        totalDownloads += count
        if (count > maxDownloads) {
          maxDownloads = count
          hotFileName = file.name
        }
      })
      
      document.getElementById('totalFiles').textContent = totalFiles
      document.getElementById('totalDownloads').textContent = totalDownloads
      document.getElementById('todayDownloads').textContent = getTodayDownloads()
      document.getElementById('hotFile').textContent = hotFileName.length > 8 
        ? hotFileName.substring(0, 8) + '...' 
        : hotFileName
    }

    // 获取文件大小
    async function fetchFileSize(filename) {
      try {
        const response = await fetch(`files/${filename}`, { method: 'HEAD' })
        if (response.ok) {
          const size = response.headers.get('content-length')
          return size ? parseInt(size) : null
        }
      } catch (e) {
        console.log('无法获取文件大小:', filename)
      }
      return null
    }

    // 渲染列表视图
    function renderListView() {
      const list = document.getElementById('fileList')
      list.innerHTML = ''
      list.className = 'file-list'
      
      if (filteredFiles.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-title">没有找到文件</div>
            <p>试试其他搜索词</p>
          </div>
        `
        return
      }
      
      filteredFiles.forEach((file, index) => {
        const fileType = getFileType(file.name)
        const downloadCount = getDownloadCount(file.name)
        const isHot = downloadCount >= 5
        
        const item = document.createElement('div')
        item.className = 'file-item'
        item.style.animationDelay = `${index * 0.05}s`
        
        item.innerHTML = `
          <a class="file-info" href="files/${file.name}" download="${file.name}" onclick="handleDownload('${file.name}', event); return true;" style="text-decoration: none;">
            <div class="file-icon-wrapper ${fileType.type}">${fileType.icon}</div>
            <div class="file-details">
              <div class="file-name">
                ${file.name}
                ${isHot ? '<span style="color: var(--hot);">🔥</span>' : ''}
              </div>
              <div class="file-meta">
                <span class="file-type-badge">${fileType.name}</span>
                <span class="file-date">${new Date(file.date).toLocaleDateString('zh-CN')}</span>
              </div>
            </div>
          </a>
          <div class="file-size">${formatSize(file.size)}</div>
          <div class="download-count ${isHot ? 'hot' : ''}">
            <span class="count-icon">⬇️</span>
            <span class="count-value">${downloadCount}</span>
          </div>
          <div class="file-actions">
            <button class="action-btn" onclick="event.stopPropagation(); copyLink('${file.name}')" title="复制链接">📋</button>
            <button class="action-btn" onclick="event.stopPropagation(); showFileDetails('${file.name}')" title="查看详情">ℹ️</button>
            <a class="download-btn" href="files/${file.name}" download="${file.name}" onclick="handleDownload('${file.name}', event)">
              下载
            </a>
          </div>
        `
        
        list.appendChild(item)
      })
    }

    // 渲染网格视图
    function renderGridView() {
      const list = document.getElementById('fileList')
      list.innerHTML = ''
      list.className = 'file-grid'
      
      if (filteredFiles.length === 0) {
        list.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-icon">📭</div>
            <div class="empty-title">没有找到文件</div>
            <p>试试其他搜索词</p>
          </div>
        `
        return
      }
      
      filteredFiles.forEach((file, index) => {
        const fileType = getFileType(file.name)
        const downloadCount = getDownloadCount(file.name)
        const isHot = downloadCount >= 5
        
        const item = document.createElement('div')
        item.className = 'grid-item'
        item.style.animationDelay = `${index * 0.05}s`
        
        item.innerHTML = `
          <a class="file-icon-wrapper ${fileType.type}" href="files/${file.name}" download="${file.name}" onclick="handleDownload('${file.name}', event); return true;" style="text-decoration: none;">${fileType.icon}</a>
          <a href="files/${file.name}" download="${file.name}" onclick="handleDownload('${file.name}', event); return true;" style="text-decoration: none;">
            <div class="file-name" title="${file.name}">${file.name}</div>
          </a>
          <div class="file-meta">
            <span class="file-type-badge">${fileType.name}</span>
            <span>${formatSize(file.size)}</span>
          </div>
          <div class="download-count ${isHot ? 'hot' : ''}">
            <span class="count-icon">${isHot ? '🔥' : '⬇️'}</span>
            <span class="count-value">${downloadCount} 次下载</span>
          </div>
          <div class="file-actions">
            <button class="action-btn" onclick="event.stopPropagation(); copyLink('${file.name}')" title="复制链接" style="flex: 0 0 40px;">📋</button>
            <button class="action-btn" onclick="event.stopPropagation(); showFileDetails('${file.name}')" title="查看详情" style="flex: 0 0 40px;">ℹ️</button>
            <a class="download-btn" href="files/${file.name}" download="${file.name}" onclick="handleDownload('${file.name}', event)" style="flex: 1;">
              下载
            </a>
          </div>
        `
        
        list.appendChild(item)
      })
    }

    // 渲染文件列表
    async function renderFileList() {
      for (const file of files) {
        if (file.size === null) {
          file.size = await fetchFileSize(file.name)
        }
      }
      
      if (currentView === 'list') {
        renderListView()
      } else {
        renderGridView()
      }
      
      updateStats()
    }

    // 点击外部关闭下拉菜单和模态框
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown')) {
        document.getElementById('sortDropdown')?.classList.remove('active')
      }
      if (e.target.classList.contains('modal')) {
        closeModal()
      }
    })

    // 初始化
    renderFileList()
  </script>
</body>
</html>
